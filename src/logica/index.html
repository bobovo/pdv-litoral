<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8">
	<title>PDV Litoral SC</title>
	<style>
		body {
			font-family: Arial, sans-serif;
			background: #1a1a2e;
			color: white;
			padding: 20px;
		}
		.card {
			background: #16213e;
			padding: 20px;
			border-radius: 8px;
			max-width: 400px;
		}
		input {
			padding: 10px;
			font-size: 16px;
			width: 100%;
			margin: 10px 0;
			border-radius: 4px;
			border: none;
		}
		button {
			padding: 10px 20px;
			background: #e94560;
			color: white;
			font-size: 16px;
			border: none;
			border-radius: 4px;
			cursor: pointer;
			width: 100%;
		}
		.total {
			font-size: 24px;
			color: #00ff88;
			margin-top: 10px;
		}
		.erro {
			color: #ff4444;
		}
	</style>
</head>
<body>

	<div class="card">
		<h2>PDV - Loja Embalagens</h2>
		<p>Produto: Sacola Plástica 25x35</p>
		<p>Quantidade: 3</p>
		<p class="total">Total: R$ 13.50</p>

		<input type="number" id="valorPago" placeholder="Digite o valor pago">
		<button onclick="calcular()">Calcular Troco</button>

		<p id="resultado"></p>
	</div>

	<script>
		function calcular() {
			let totalVenda = 13.50
			let valorPago = parseFloat(document.getElementById("valorPago").value)

			if (isNaN(valorPago)) {
				document.getElementById("resultado").textContent = "Digite um valor!"
				document.getElementById("resultado").className = "erro"
				return
			}

			if (valorPago < totalVenda) {
				document.getElementById("resultado").textContent = "Valor insuficiente!"
				document.getElementById("resultado").className = "erro"
				return
			}

			let troco = valorPago - totalVenda
			document.getElementById("resultado").textContent = "Troco: R$" + troco.toFixed(2)
			document.getElementById("resultado").className = "total"
		}
	</script>
</body>
</html>
